services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-spares}
      POSTGRES_USER: ${DB_USER:-spares}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spares}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-spares}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/data/media
      - backups:/data/backups
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_defaults &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers 3 --threads 4 --timeout 120
             --access-logfile - --error-logfile -"

  # Nightly backup. Files land in the same volume the Backup screen lists.
  backup:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - media:/data/media
      - backups:/data/backups
    entrypoint: >
      sh -c "while true; do
               sleep 86400;
               python manage.py backup_now --scheduled;
             done"

volumes:
  pgdata:
  media:
  backups:
