{% extends "base.html" %}
{% block content %}
<form method="post" enctype="multipart/form-data" novalidate data-location-chain>
  {% csrf_token %}
  <div class="card">
    <div class="card__body">
      {% if form.non_field_errors %}
        <div class="alert alert--error mb-16">{{ form.non_field_errors }}</div>
      {% endif %}
      <div class="form-grid">
        {% for field in form %}
          {% include "partials/form_field.html" with field=field %}
        {% endfor %}
      </div>
    </div>
    <div class="card__foot btn-row">
      <button class="btn btn--primary" type="submit">Save</button>
      <a class="btn" href="{{ cancel_url|default:'..' }}">Cancel</a>
    </div>
  </div>
</form>
{% endblock %}
