{% if messages %}
<div class="messages">
  {% for message in messages %}
    <div class="alert alert--{{ message.tags|default:'info' }}">
      <svg class="ico" width="16" height="16" style="flex:0 0 16px;margin-top:1px"><use href="#i-alert"/></svg>
      <div>{{ message }}</div>
    </div>
  {% endfor %}
</div>
{% endif %}
